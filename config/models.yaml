# Detox — LLM stage configuration. Stages are individually switchable:
#   off | rules-only | llm
# Experiment 001: news lanes run rules-only/off (Newsflash supplies dedupe,
# corroboration, summaries). LLM budget is reserved for digests and tiebreaks.

router:
  provider: backboard             # OpenAI-compatible; any provider by base URL
  key_env: BACKBOARD_API_KEY
  # base_url set at build time; the LlmClient speaks the OpenAI-compatible API

models:
  bulk: gemini-3.8-flash          # free tier, 5 RPM — batch hard (60 items/call)
  interactive: gpt-5.6-luna       # ~$0.20/$1.20 per 1M; retries, interactive paths

stages:
  select:    { model: bulk,        mode: rules-only }
  summarize: { model: bulk,        mode: rules-only }   # Newsflash canonical summaries cover news
  dedupe:    { model: interactive, mode: rules-only }   # lexical + event-ID identity first
  digests:   { model: bulk,        mode: llm }          # morning digest: ON (user decision 2026-09-30)
  taste:     { model: bulk,        mode: llm }          # TV new-show confidence (experiment 011)
                                                         # rules-only mode = genre/creator/network overlap alone

overrides:
  # Reddit gets NO LLM involvement at all (user decision 2026-10-01): full
  # posts and top comments render raw. This is not a degradation mode — it is
  # the permanent design.
  reddit: { summarize: { model: bulk, mode: off } }

budget:
  daily_cap_usd: 0.05
  over_cap_behavior: rules-only   # never block the run; degrade and say so
  cache: { key: "stage-version + item content", ttl_days: 30 }
